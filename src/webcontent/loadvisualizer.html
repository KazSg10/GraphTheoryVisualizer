<!DOCTYPE html>
<html>
<title>Canvases</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
	<style>
		#divGraph{
			float: left;
			padding: 0;
		}
		#divADT{
			float: right;
			padding: 0;
		}
		#divPseudocode{
			float: right;
			padding: 0;	
		}
		.buttons{
			text-align: center;
			padding: 15px 32px;
			font-size: 20px;
			background-color: #313ef1;
		}
		#canvasplaceholder {
			margin-left:0;
			margin-right:auto;
		}

	</style>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
	<h1 text>Visualization </h1>

	<div id = "settingButtons" class="buttons">		
		<button id="homeButton" style="margin-left: auto;" onclick="history.back()"> Home </button>
		<button id="Play" style="margin-left: center;" onClick="simulate()"> Play </button>
		<button id="Stop" style="margin-left: center;"> Stop </button>
	</div>

	<!-- Creating three div elements to represent three different parts of the HTML webpage collating them in one div
	 	 for styling all the canvases together. Each div element will be used to contain one canvas.
	-->
	<div id="canvasplaceholder">
		<div id="divGraph" height></div>
		<div id="divADT"></div>
		<div id="divPseudocode"></div>
	</div>	 
	
	<script type="text/javascript" src="Circle.js"></script>
	<script type="text/javascript" src="Line.js"></script>
	<script type="text/javascript" src="initialise.js"></script>
	<script type="text/javascript" src="animation.js"></script>

	<script>
		var innerWidth = window.innerWidth;
		var innerHeight = window.innerHeight;

		function createCanvasElement(divId, canvasId, width, height) {
			//Getting reference of div element from DOM (Document Object Model - Tree representation of HTML elements)
			const divReference = document.getElementById(divId);
			divReference.width = width;
			divReference.height = height;
			//Creating canvas element
			const canvas = document.createElement("canvas");
			//Setting newly created canvas' id
			canvas.id=canvasId;
			//Setting newly created canvas' width and height
			canvas.width=width;
			canvas.height=height;
			//Setting newly created canvas' border style
			canvas.style.border="5px solid  #00004d";
			//Adding the canvas element as a child node of the div element in DOM
			divReference.appendChild(canvas);
			return canvas;
		}
			
		//Creating three canvases and linking them to the three div elements created above
		var canvasGraph = createCanvasElement('divGraph','canvasGraph',innerWidth*0.6,innerHeight*0.86);
		var canvasADT = createCanvasElement('divADT','canvasADT',innerWidth*0.38,innerHeight*0.425);
		var canvasPseudocode = createCanvasElement('divPseudocode','canvasPseudocode',innerWidth*0.38,innerHeight*0.425);

		const circlesArray = initialise();
		function simulate(){
			animate("DFS", circlesArray);
		}

	</script>

	
	
</body>
